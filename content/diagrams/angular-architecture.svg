<defs>
<marker id="aa-ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="f-green"/></marker>
<marker id="aa-ar-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="f-pink"/></marker>
<marker id="aa-ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="f-blue"/></marker>
<marker id="aa-ar-peach" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="f-peach"/></marker>
<marker id="aa-ar-mauve" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="f-mauve"/></marker>
<marker id="aa-ar-sap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="f-sap"/></marker>
</defs>

<rect class="bg" width="1160" height="880" rx="12"/>

<!-- ============ Directives & Pipes ============ -->
<rect class="mauve" x="10" y="10" width="240" height="535" rx="10"/>
<text class="h t-mauve" x="130" y="38" text-anchor="middle">Directives</text>
<text class="m s" x="130" y="56" text-anchor="middle">change the DOM / template</text>

<rect class="mauve" x="24" y="68" width="212" height="66" rx="7"/>
<text class="b" x="130" y="88" text-anchor="middle">Structural</text>
<text class="c" x="130" y="106" text-anchor="middle">*ngIf · *ngFor · *ngSwitch</text>
<text class="c t-mauve" x="130" y="124" text-anchor="middle">v17+: @if · @for · @switch</text>

<rect class="mauve" x="24" y="142" width="212" height="48" rx="7"/>
<text class="b" x="130" y="162" text-anchor="middle">Attribute</text>
<text class="c" x="130" y="180" text-anchor="middle">ngClass · ngStyle · ngModel</text>

<rect class="mauve" x="24" y="198" width="212" height="48" rx="7"/>
<text class="b" x="130" y="218" text-anchor="middle">Custom</text>
<text class="c" x="130" y="236" text-anchor="middle">@Directive · appHighlight</text>

<line x1="24" y1="266" x2="236" y2="266" class="ln dash s-mauve"/>

<text class="h t-mauve" x="130" y="294" text-anchor="middle">Pipes</text>
<text class="m s" x="130" y="312" text-anchor="middle">format data in the template</text>

<rect class="mauve" x="24" y="324" width="212" height="48" rx="7"/>
<text class="b" x="130" y="344" text-anchor="middle">Built-in</text>
<text class="c" x="130" y="362" text-anchor="middle">date · currency · async</text>

<rect class="mauve" x="24" y="380" width="212" height="48" rx="7"/>
<text class="b" x="130" y="400" text-anchor="middle">Custom</text>
<text class="c" x="130" y="418" text-anchor="middle">@Pipe({ name: 'inr' })</text>

<rect class="mauve" x="24" y="436" width="212" height="48" rx="7"/>
<text class="b" x="130" y="456" text-anchor="middle">Used in template</text>
<text class="c" x="130" y="474" text-anchor="middle">{{ value | pipeName }}</text>

<text class="m s" x="130" y="508" text-anchor="middle">Pure pipes re-run only when</text>
<text class="m s" x="130" y="525" text-anchor="middle">the input value changes</text>

<!-- used in template -->
<line x1="250" y1="420" x2="284" y2="420" class="ln dash s-mauve" marker-end="url(#aa-ar-mauve)"/>

<!-- ============ Component ============ -->
<rect class="blue" x="270" y="10" width="580" height="535" rx="10"/>
<text class="h t-blue" x="560" y="38" text-anchor="middle">Component  =  class + template + styles</text>

<rect class="code" x="286" y="54" width="392" height="176" rx="6"/>
<text class="c" x="300" y="76"><tspan class="dec">@Component</tspan>({</text>
<text class="c" x="300" y="95">  selector: <tspan class="str">'app-home'</tspan>,</text>
<text class="c" x="300" y="114">  templateUrl: <tspan class="str">'./home.html'</tspan>,</text>
<text class="c" x="300" y="133">  styleUrl: <tspan class="str">'./home.css'</tspan>,</text>
<text class="c" x="300" y="152">})</text>
<text class="c" x="300" y="171"><tspan class="kw">export class</tspan> HomeComponent {</text>
<text class="c" x="300" y="190">  title = <tspan class="str">'Angular'</tspan>;</text>
<text class="c" x="300" y="209">  <tspan class="kw">constructor</tspan>(<tspan class="kw">private</tspan> users: UserService) {}</text>
<text class="c" x="300" y="224">}</text>

<rect class="blue" x="694" y="54" width="142" height="176" rx="7"/>
<text class="b t-blue" x="765" y="76" text-anchor="middle">Metadata</text>
<text class="m s" x="765" y="93" text-anchor="middle">decorator config</text>
<text x="710" y="118">• selector</text>
<text x="710" y="139">• template</text>
<text x="710" y="160">• styles</text>
<text x="710" y="181">• imports</text>
<text x="710" y="202">• providers</text>
<line x1="694" y1="142" x2="682" y2="142" class="ln dash s-blue" marker-end="url(#aa-ar-blue)"/>

<!-- bindings -->
<line x1="320" y1="236" x2="320" y2="290" class="ln s-green" stroke-width="2.2" marker-end="url(#aa-ar-green)"/>
<text class="b t-green" x="332" y="256">Property binding</text>
<text class="m s" x="332" y="274">[value]="title" · {{ title }}</text>
<text class="m s" x="332" y="289">component → template</text>

<line x1="600" y1="290" x2="600" y2="236" class="ln s-pink" stroke-width="2.2" marker-end="url(#aa-ar-pink)"/>
<text class="b t-pink" x="612" y="256">Event binding</text>
<text class="m s" x="612" y="274">(click)="onClick()"</text>
<text class="m s" x="612" y="289">template → component</text>

<rect class="green" x="286" y="298" width="550" height="232" rx="7"/>
<text class="b t-green" x="561" y="320" text-anchor="middle">Template (HTML)</text>
<text class="c" x="304" y="346"><tspan class="tag">&lt;div&gt;</tspan></text>
<text class="c" x="304" y="366">  <tspan class="tag">&lt;h1&gt;</tspan>{{ title }}<tspan class="tag">&lt;/h1&gt;</tspan></text>
<text class="c" x="304" y="386">  <tspan class="tag">&lt;input</tspan> <tspan class="at">[value]</tspan>=<tspan class="str">"title"</tspan> <tspan class="at">(input)</tspan>=<tspan class="str">"onInput($event)"</tspan> <tspan class="tag">/&gt;</tspan></text>
<text class="c" x="304" y="406">  <tspan class="tag">&lt;button</tspan> <tspan class="at">(click)</tspan>=<tspan class="str">"onClick()"</tspan><tspan class="tag">&gt;</tspan>Click me<tspan class="tag">&lt;/button&gt;</tspan></text>
<text class="c" x="304" y="426">  <tspan class="kw">@if</tspan> (isVisible) { <tspan class="tag">&lt;p&gt;</tspan>This is visible<tspan class="tag">&lt;/p&gt;</tspan> }</text>
<text class="c" x="304" y="446">  <tspan class="tag">&lt;app-child</tspan> <tspan class="at">[data]</tspan>=<tspan class="str">"title"</tspan> <tspan class="tag">/&gt;</tspan></text>
<text class="c" x="304" y="466">  <tspan class="tag">&lt;span&gt;</tspan>{{ title | <tspan class="kw">uppercase</tspan> }}<tspan class="tag">&lt;/span&gt;</tspan></text>
<text class="c" x="304" y="486"><tspan class="tag">&lt;/div&gt;</tspan></text>
<text class="m s" x="304" y="514">Two-way binding = both together: [(ngModel)]="title"  ("banana in a box")</text>

<!-- ============ Dependency Injection ============ -->
<rect class="peach" x="870" y="10" width="280" height="535" rx="10"/>
<text class="h t-peach" x="1010" y="38" text-anchor="middle">Dependency Injection</text>

<rect class="peach" x="884" y="54" width="252" height="70" rx="7"/>
<text class="b" x="1010" y="76" text-anchor="middle">Injector</text>
<text class="m s" x="1010" y="94" text-anchor="middle">creates services and hands them</text>
<text class="m s" x="1010" y="110" text-anchor="middle">to whoever asks for them</text>

<line x1="1010" y1="124" x2="1010" y2="148" class="ln s-peach" marker-end="url(#aa-ar-peach)"/>

<rect class="peach" x="884" y="150" width="252" height="176" rx="7"/>
<text class="b t-peach" x="1010" y="172" text-anchor="middle">Services</text>
<text class="c" x="1010" y="194" text-anchor="middle">@Injectable({</text>
<text class="c" x="1010" y="210" text-anchor="middle">  providedIn: <tspan class="str">'root'</tspan> })</text>
<text class="m s" x="1010" y="230" text-anchor="middle">'root' = one app-wide singleton</text>
<text class="m s" x="1010" y="246" text-anchor="middle">component-level = one per component</text>
<text class="c" x="900" y="272">UserService</text>
<text class="c" x="900" y="291">ProductService</text>
<text class="c" x="900" y="310">AuthService …</text>

<line x1="1010" y1="326" x2="1010" y2="350" class="ln s-peach" marker-end="url(#aa-ar-peach)"/>

<rect class="red" x="884" y="352" width="252" height="128" rx="7"/>
<text class="b t-red" x="1010" y="374" text-anchor="middle">HttpClient → APIs</text>
<text class="m s" x="1010" y="392" text-anchor="middle">the data source</text>
<text x="900" y="418">• REST / Web APIs (Observables)</text>
<text x="900" y="440">• Interceptors: auth token,</text>
<text x="912" y="458">errors, loading spinner</text>

<text class="m s" x="1010" y="508" text-anchor="middle">Ask for a dependency with the</text>
<text class="m s" x="1010" y="525" text-anchor="middle">constructor or inject(UserService)</text>

<!-- DI injects into the component's constructor -->
<line x1="884" y1="240" x2="853" y2="240" class="ln dash s-peach" stroke-width="2" marker-end="url(#aa-ar-peach)"/>

<!-- ============ Router ============ -->
<circle cx="60" cy="640" r="30" class="sap"/>
<rect x="44" y="628" width="32" height="24" rx="3" class="ln s-sap"/>
<line x1="44" y1="635" x2="76" y2="635" class="ln s-sap"/>
<text class="b" x="60" y="690" text-anchor="middle">Browser</text>
<text class="m s" x="60" y="706" text-anchor="middle">/products/7</text>
<line x1="90" y1="654" x2="124" y2="654" class="ln s-sap" marker-end="url(#aa-ar-sap)"/>

<rect class="sap" x="110" y="570" width="1040" height="130" rx="10"/>
<text class="h t-sap" x="630" y="594" text-anchor="middle">Router</text>
<text class="m s" x="630" y="611" text-anchor="middle">maps the URL to the component that should be on screen</text>

<rect class="sap" x="126" y="626" width="236" height="56" rx="7"/>
<text class="b" x="244" y="649" text-anchor="middle">Routes</text>
<text class="m s" x="244" y="668" text-anchor="middle">path → component · guards · lazy</text>
<line x1="362" y1="654" x2="388" y2="654" class="ln s-sap" marker-end="url(#aa-ar-sap)"/>

<rect class="sap" x="390" y="626" width="236" height="56" rx="7"/>
<text class="b" x="508" y="649" text-anchor="middle">Router</text>
<text class="m s" x="508" y="668" text-anchor="middle">matches the URL, runs guards</text>
<line x1="626" y1="654" x2="652" y2="654" class="ln s-sap" marker-end="url(#aa-ar-sap)"/>

<rect class="sap" x="654" y="626" width="236" height="56" rx="7"/>
<text class="b" x="772" y="649" text-anchor="middle">ActivatedRoute</text>
<text class="m s" x="772" y="668" text-anchor="middle">route params · query params · data</text>
<line x1="890" y1="654" x2="916" y2="654" class="ln s-sap" marker-end="url(#aa-ar-sap)"/>

<rect class="sap" x="918" y="626" width="218" height="56" rx="7"/>
<text class="b c" x="1027" y="649" text-anchor="middle">&lt;router-outlet&gt;</text>
<text class="m s" x="1027" y="668" text-anchor="middle">renders the matched component</text>

<!-- outlet renders the component -->
<path d="M1027 626 V560 H560 V548" class="ln s-blue" stroke-width="2" marker-end="url(#aa-ar-blue)"/>

<!-- ============ NgModule ============ -->
<rect class="yellow" x="10" y="720" width="1140" height="104" rx="10"/>
<text class="h t-yellow" x="30" y="748">NgModule (optional in modern Angular)</text>
<text x="30" y="772">Groups components, directives, pipes and services into one unit.</text>
<text class="m" x="30" y="794">Standalone components import what they need directly: stable in v15, generated by <tspan class="c">ng new</tspan> since v17,</text>
<text class="m" x="30" y="812">and <tspan class="c">standalone: true</tspan> is the default since v19.</text>
<line x1="790" y1="736" x2="790" y2="810" class="ln dash s-mauve" stroke-opacity=".5"/>
<text x="812" y="760">• declarations</text>
<text x="812" y="790">• imports</text>
<text x="972" y="760">• providers</text>
<text x="972" y="790">• exports</text>

<!-- ============ Legend ============ -->
<g transform="translate(10 846)">
<line x1="0" y1="10" x2="34" y2="10" class="ln s-green" stroke-width="2.2" marker-end="url(#aa-ar-green)"/><text class="s" x="42" y="14">property binding</text>
<line x1="170" y1="10" x2="204" y2="10" class="ln s-pink" stroke-width="2.2" marker-end="url(#aa-ar-pink)"/><text class="s" x="212" y="14">event binding</text>
<line x1="320" y1="10" x2="354" y2="10" class="ln dash s-blue" marker-end="url(#aa-ar-blue)"/><text class="s" x="362" y="14">metadata</text>
<line x1="450" y1="10" x2="484" y2="10" class="ln dash s-peach" marker-end="url(#aa-ar-peach)"/><text class="s" x="492" y="14">DI (injects)</text>
<line x1="600" y1="10" x2="634" y2="10" class="ln dash s-mauve" marker-end="url(#aa-ar-mauve)"/><text class="s" x="642" y="14">used in template</text>
<line x1="770" y1="10" x2="804" y2="10" class="ln s-sap" marker-end="url(#aa-ar-sap)"/><text class="s" x="812" y="14">navigation</text>
<line x1="910" y1="10" x2="944" y2="10" class="ln s-blue" stroke-width="2" marker-end="url(#aa-ar-blue)"/><text class="s" x="952" y="14">router renders component</text>
</g>
</svg>
